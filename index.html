<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ouvrir L’Inventaire</title>
    <meta
      name="description"
      content="Page d’accès locale à la boutique L’Inventaire."
    />
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f7f3eb;
        color: #20241f;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 80% 10%, #e9dfd0 0, transparent 35%),
          #f7f3eb;
      }

      main {
        width: min(100%, 680px);
        padding: clamp(32px, 8vw, 72px);
        border: 1px solid rgba(32, 36, 31, 0.14);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 24px 70px rgba(35, 30, 20, 0.08);
        text-align: center;
      }

      .eyebrow {
        margin: 0;
        color: #a35f3f;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 0;
        color: #173f35;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(46px, 10vw, 78px);
        font-weight: 400;
        letter-spacing: -0.05em;
      }

      p {
        margin: 20px auto 0;
        max-width: 480px;
        color: #66645e;
        font-size: 16px;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        min-height: 50px;
        align-items: center;
        justify-content: center;
        margin-top: 30px;
        padding: 12px 24px;
        border-radius: 999px;
        background: #173f35;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover { background: #285f50; }

      small {
        display: block;
        margin-top: 22px;
        color: #8a877f;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Boutique locale</p>
      <h1>L’Inventaire</h1>
      <p>
        Accédez à la boutique d’objets de collection depuis votre navigateur.
      </p>
      <a href="http://localhost:3000/">Le site est déjà démarré ? L’ouvrir</a>
      <small>
        Pour démarrer le site, utilisez l’icône
        <strong>L’Inventaire — Ouvrir</strong> créée sur votre Bureau.
      </small>
    </main>
  </body>
</html>
